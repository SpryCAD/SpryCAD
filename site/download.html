<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download SpryCAD</title>
  <meta name="description" content="Download SpryCAD for Windows and Linux, any released version, with install instructions.">
  <link rel="icon" href="/img/logo.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/download.js" defer></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/"><img src="/img/logo.png" alt="">SpryCAD</a>
      <nav>
        <a href="/download" aria-current="page">Download</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="band">
      <div class="wrap page-title">
        <span class="eyebrow">Download</span>
        <h1>Get SpryCAD</h1>
        <p class="lead">64-bit Windows 10/11 and Linux (x86-64). Pick a channel, a version and your system.</p>
      </div>
    </section>

    <div class="wrap">
      <div class="picker">
        <div class="head"><strong>Release</strong><span class="meta" id="meta"></span></div>
        <div class="body">
          <div>
            <label id="lbl-channel">Channel</label>
            <div class="seg" role="group" aria-labelledby="lbl-channel" id="channel">
              <button type="button" data-value="stable">Stable</button>
              <button type="button" data-value="dev">Dev builds</button>
            </div>
          </div>
          <div>
            <label for="version">Version</label>
            <select id="version" disabled><option>Loading…</option></select>
          </div>
          <div>
            <label id="lbl-os">System</label>
            <div class="seg" role="group" aria-labelledby="lbl-os" id="os">
              <button type="button" data-value="windows">Windows</button>
              <button type="button" data-value="linux">Linux</button>
            </div>
          </div>
        </div>
      </div>

      <div id="notice"></div>
      <div id="content"></div>
    </div>
  </main>

  <footer class="site">
    <div class="wrap"><span class="brand-sm">SpryCAD</span><a href="/">Home</a></div>
  </footer>
</body>
</html>
