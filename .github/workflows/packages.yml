# Builds the Windows installer and the Linux packages (tar.gz and .deb).
#   - Run by hand (Actions > Packages > Run workflow): the packages are attached to the run as artifacts.
#   - Push a version tag (git tag v0.2.0 && git push origin v0.2.0): the same, plus a published GitHub release with
#     the packages attached (a tag with a suffix, v0.2.0-beta, is marked a pre-release). Pushing the tag again
#     (moved to another commit) replaces the release's packages.
# The version always comes from git (the build scripts): on a tag v0.2.0 it is 0.2.0, three commits later 0.2.0-dev.3.
# The checkouts fetch the full history so the tags are there to describe.
name: Packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Inno Setup, unless the runner image already has it; the C++ build tools (thumbnail handler) come with it
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: ./build/make-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: publish/FeatherCAD_setup_v*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build packages
        run: bash build/make-linux-package.sh
      # a quick check that the .deb is well formed and holds what it should
      - name: Inspect .deb
        run: |
          deb=$(ls publish/feathercad_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" > contents.txt
          for f in ./opt/feathercad/FeatherCAD ./usr/bin/feathercad ./usr/share/applications/feathercad.desktop \
                   ./usr/share/mime/packages/feathercad.xml ./usr/share/icons/hicolor/256x256/apps/feathercad.png; do
            grep -q " $f\( \|$\)" contents.txt || { echo "missing from the .deb: $f"; exit 1; }
          done
          grep ' ./opt/feathercad/FeatherCAD$' contents.txt | grep -q '^-rwxr-xr-x root/root' || { echo "FeatherCAD is not root-owned 755"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            publish/FeatherCAD-*-linux-x64.tar.gz
            publish/feathercad_*_amd64.deb
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          pre=false; case "$tag" in *-*) pre=true ;; esac
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # the tag was pushed again: same release, current packages, published (it may be an older draft)
            gh release upload "$tag" packages/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=$pre
          else
            gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --prerelease=$pre --title "FeatherCAD ${tag#v}"
          fi
