# Builds the Windows installer and the Linux packages (tar.gz and .deb) and publishes them to Cloudflare R2: a
# signed apt repository, the downloads, and an update feed (build/publish-r2.py has the bucket layout).
#   - Push to master: the dev channel (apt suite "dev", updates/dev.json), version 0.2.0-dev.3 (.deb 0.2.0+dev.3).
#     Dev keeps the newest 15 builds.
#   - Push a version tag (git tag v0.2.0 && git push origin v0.2.0): the stable channel (apt suite "stable",
#     updates/stable.json), plus a published GitHub release whose notes link to the files on R2; nothing is
#     uploaded to GitHub. A tag with a suffix, v0.2.0-beta, is marked a pre-release. Pushing the tag again (moved
#     to another commit) rebuilds and replaces that version.
#   - Run by hand (Actions > Packages > Run workflow): builds; publishes only from master or a tag.
# The version always comes from git (the build scripts); the checkouts fetch the full history for the tags.
#
# One-time setup (repository Settings > Secrets and variables > Actions):
#   Secrets   R2_ENDPOINT           the bucket's S3 API URL (bucket Settings): https://<account id>.r2.cloudflarestorage.com
#             R2_ACCESS_KEY_ID      R2 API token (Object Read & Write, this bucket only): access key ID
#             R2_SECRET_ACCESS_KEY  ... and its secret access key
#             APT_GPG_PRIVATE_KEY   armored private key that signs the apt repository (gpg --armor --export-secret-keys)
#             APT_GPG_PASSPHRASE    its passphrase (leave unset for a key without one)
#             UPDATE_SIGNING_KEY    PEM private key (ECDSA P-256) that signs the update feed; its public half is in
#                                   src/SpryCad.App/Updater.cs
#   Variables R2_BUCKET             the bucket name
#             R2_PUBLIC_URL         the bucket's public URL: https://download.sprycad.com (its custom domain); a variable
#                                   (a secret works too, but then the logs show it as ***)
name: Packages

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Inno Setup, unless the runner image already has it; the C++ build tools (thumbnail handler) come with it
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # The app checks this feed for updates (src/SpryCad.App/Updater.cs); a build without them never checks.
      - name: Build installer
        shell: pwsh
        env:
          SPRYCAD_UPDATE_URL: ${{ vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
          SPRYCAD_UPDATE_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'dev' }}
        run: ./build/make-installer.ps1
      # only to hand the file to the publish job: kept a day, R2 holds the packages
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: publish/SpryCAD_setup_v*.exe
          if-no-files-found: error
          retention-days: 1

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # rpmbuild, for the .rpm beside the .deb
      - name: Install rpm
        run: sudo apt-get install -y -q --no-install-recommends rpm
      - name: Build packages
        run: bash build/make-linux-package.sh
      # a quick check that the .deb is well formed and holds what it should
      - name: Inspect .deb
        run: |
          deb=$(ls publish/sprycad_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" > contents.txt
          for f in ./opt/sprycad/SpryCAD ./usr/bin/sprycad ./usr/share/applications/sprycad.desktop \
                   ./usr/share/mime/packages/sprycad.xml ./usr/share/icons/hicolor/256x256/apps/sprycad.png; do
            grep -q " $f\( \|$\)" contents.txt || { echo "missing from the .deb: $f"; exit 1; }
          done
          grep ' ./opt/sprycad/SpryCAD$' contents.txt | grep -q '^-rwxr-xr-x root/root' || { echo "SpryCAD is not root-owned 755"; exit 1; }
      # and the .rpm: the same files, root-owned, the program executable, its requirements
      - name: Inspect .rpm
        run: |
          rpm=$(ls publish/sprycad-*.x86_64.rpm)
          rpm -qip "$rpm"
          rpm -qpR "$rpm"
          rpm -qplv "$rpm" > contents.txt
          for f in /opt/sprycad/SpryCAD /usr/bin/sprycad /usr/share/applications/sprycad.desktop \
                   /usr/share/mime/packages/sprycad.xml /usr/share/icons/hicolor/256x256/apps/sprycad.png; do
            grep -q " $f\( \|$\)" contents.txt || { echo "missing from the .rpm: $f"; exit 1; }
          done
          grep ' /opt/sprycad/SpryCAD$' contents.txt | grep -q '^-rwxr-xr-x .*root *root' || { echo "SpryCAD is not root-owned 755"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            publish/SpryCAD-*-linux-x64.tar.gz
            publish/sprycad_*_amd64.deb
            publish/sprycad-*.x86_64.rpm
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/master' || github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the GitHub release
    # One publish per channel at a time: each rewrites its channel's index. Not cancelled midway (that could leave
    # an index naming a file not yet uploaded); a newer queued dev build replaces an older queued one.
    concurrency:
      group: publish-${{ github.ref_type == 'tag' && 'stable' || 'dev' }}
      cancel-in-progress: false
    env:
      CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'dev' }}
      # a secret or a variable, either works
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 does not take the checksum headers newer AWS CLIs add by default
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: build
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Install repository tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dpkg-dev apt-utils rpm createrepo-c
      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "APT_GPG_PRIVATE_KEY is not set"; exit 1; }
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish to R2
        run: |
          python3 build/publish-r2.py --channel "$CHANNEL" \
            --deb packages/sprycad_*_amd64.deb \
            --rpm packages/sprycad-*.x86_64.rpm \
            --tarball packages/SpryCAD-*-linux-x64.tar.gz \
            --installer packages/SpryCAD_setup_v*.exe \
            --notes-out links.md
          cat links.md >> "$GITHUB_STEP_SUMMARY"
      # the release carries links to R2, not the files
      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          pre=false; case "$tag" in *-*) pre=true ;; esac
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # the tag was pushed again: same release, current links, published (it may be an older draft)
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file links.md --draft=false --prerelease=$pre
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file links.md --generate-notes \
              --prerelease=$pre --title "SpryCAD ${tag#v}"
          fi
