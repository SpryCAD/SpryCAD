# Rejects pushes and pull requests containing commits with AI co-author attribution, using the same check as the
# local commit-msg hook (.githooks/commit-msg), so it also catches commits made without the hook or with --no-verify.
name: Commit messages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for co-author attribution
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before"; check just its tip.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="-1 $AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          failed=0
          for sha in $(git rev-list $range); do
            git log -1 --format=%B "$sha" > msg.txt
            if ! sh .githooks/commit-msg msg.txt 2>/dev/null; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has a Co-Authored-By: Claude trailer"
              failed=1
            fi
          done
          exit $failed
