<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Counterbore: the hole in section, a steel block cut through its middle (hatched), the hole's wall in blue -->
  <defs>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="4" fill="#D5DBE3"/><path d="M0 0V4" stroke="#AEB8C5" stroke-width="1.2"/>
    </pattern>
  </defs>
  <g stroke-linejoin="miter" stroke-linecap="square">
    <path d="M2.5 7.5H6.5V15.5H11V28.5H2.5Z" fill="url(#hatch)" stroke="#24364F"/>
    <path d="M29.5 7.5H25.5V15.5H21V28.5H29.5Z" fill="url(#hatch)" stroke="#24364F"/>
    <path d="M6.5 7.5V15.5H11V28.5 M25.5 7.5V15.5H21V28.5" fill="none" stroke="#2F7BD6" stroke-width="2"/>
    <path d="M16 3.5V30.5" fill="none" stroke="#2F7BD6" stroke-width="0.9" stroke-dasharray="3 1.5 1 1.5"/>
  </g>
</svg>
