<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Hole: a steel block (what was there) with a counterbored hole (what the command makes, blue) -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1F3F6"/><stop offset="1" stop-color="#D5DBE3"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#AEB8C5"/><stop offset="1" stop-color="#C5CDD7"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8E9BAC"/><stop offset="1" stop-color="#7A8899"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2C5592"/><stop offset=".5" stop-color="#5A8CD0"/><stop offset="1" stop-color="#9CC2EE"/></linearGradient>
    <linearGradient id="bore" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#162B4D"/><stop offset="1" stop-color="#3D6AA8"/></linearGradient>
    <clipPath id="in"><ellipse cx="16.5" cy="13.5" rx="8" ry="4"/></clipPath>
  </defs>
  <g stroke-linejoin="miter" stroke-linecap="square">
    <path d="M2.5 13.5L16.5 6.5L30.5 13.5L16.5 20.5Z" fill="url(#top)"/>
    <path d="M2.5 13.5L16.5 20.5V29.5L2.5 22.5Z" fill="url(#left)"/>
    <path d="M16.5 20.5L30.5 13.5V22.5L16.5 29.5Z" fill="url(#right)"/>
    <path d="M3.5 13.5L16.5 20 M16.5 20L29.5 13.5" fill="none" stroke="#FFFFFF" stroke-opacity=".8"/>
    <!-- the counterbore: its wall, its floor, the bore -->
    <ellipse cx="16.5" cy="13.5" rx="8" ry="4" fill="url(#wall)"/>
    <g clip-path="url(#in)">
      <ellipse cx="16.5" cy="16" rx="8" ry="4" fill="#A9CBF3"/>
      <ellipse cx="16.5" cy="16" rx="4" ry="2" fill="url(#bore)"/>
    </g>
    <ellipse cx="16.5" cy="13.5" rx="8" ry="4" fill="none" stroke="#1D4E8F"/>
    <path d="M2.5 13.5L16.5 6.5L30.5 13.5V22.5L16.5 29.5L2.5 22.5Z M2.5 13.5L16.5 20.5L30.5 13.5 M16.5 20.5V29.5" fill="none" stroke="#24364F"/>
  </g>
</svg>
