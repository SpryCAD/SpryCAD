<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Color by Feature: a stepped part made of three features, each in a color of its own (blue base, green step,
       amber boss), lit and outlined as the other solid icons -->
  <defs>
    <linearGradient id="bt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3E5F9"/><stop offset="1" stop-color="#B0CEF1"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4F1DE"/><stop offset="1" stop-color="#A6DDB9"/></linearGradient>
    <linearGradient id="at" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE6B0"/><stop offset="1" stop-color="#FFC45C"/></linearGradient>
  </defs>
  <g stroke-linejoin="miter" stroke-linecap="square">
    <!-- the base (blue) -->
    <path d="M2.5 19.5L16.5 12.5L30.5 19.5L16.5 26.5Z" fill="url(#bt)"/>
    <path d="M2.5 19.5L16.5 26.5V30.5L2.5 23.5Z" fill="#7FAAE0"/>
    <path d="M16.5 26.5L30.5 19.5V23.5L16.5 30.5Z" fill="#4F82C4"/>
    <path d="M3.5 19.5L16.5 26" fill="none" stroke="#FFFFFF" stroke-opacity=".75"/>
    <path d="M2.5 19.5L16.5 12.5L30.5 19.5V23.5L16.5 30.5L2.5 23.5Z M2.5 19.5L16.5 26.5L30.5 19.5 M16.5 26.5V30.5" fill="none" stroke="#24364F"/>
    <!-- the step (green) -->
    <path d="M7.5 15L16.5 10.5L25.5 15L16.5 19.5Z" fill="url(#gt)"/>
    <path d="M7.5 15L16.5 19.5V23.5L7.5 19Z" fill="#5DBB80"/>
    <path d="M16.5 19.5L25.5 15V19L16.5 23.5Z" fill="#2E8F55"/>
    <path d="M8.5 15L16.5 19" fill="none" stroke="#FFFFFF" stroke-opacity=".75"/>
    <path d="M7.5 15L16.5 10.5L25.5 15V19L16.5 23.5L7.5 19Z M7.5 15L16.5 19.5L25.5 15 M16.5 19.5V23.5" fill="none" stroke="#24364F"/>
    <!-- the boss (amber) -->
    <path d="M11.5 9.5L16.5 7L21.5 9.5L16.5 12Z" fill="url(#at)"/>
    <path d="M11.5 9.5L16.5 12V17L11.5 14.5Z" fill="#F0A63A"/>
    <path d="M16.5 12L21.5 9.5V14.5L16.5 17Z" fill="#C47A14"/>
    <path d="M12.5 9.5L16.5 11.5" fill="none" stroke="#FFFFFF" stroke-opacity=".75"/>
    <path d="M11.5 9.5L16.5 7L21.5 9.5V14.5L16.5 17L11.5 14.5Z M11.5 9.5L16.5 12L21.5 9.5 M16.5 12V17" fill="none" stroke="#24364F"/>
  </g>
</svg>
